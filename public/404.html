<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Lost in orbit · Brian Yip</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Standalone on purpose: GitHub Pages serves this file as-is for any
         unknown path, so it can't rely on the app bundle. Colors mirror
         src/styles/global.css. -->
    <style>
      :root {
        --bg: #111014;
        --text: #e8e6e3;
        --text-dim: #a19e99;
        --rule: #2a2c30;
        --accent: #b69cff;
        --dot: rgba(255, 255, 255, 0.28);
        --glow: rgba(140, 100, 255, 0.14);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background-color: var(--bg);
        background-image:
          radial-gradient(900px 600px at 0% 0%, var(--glow), transparent 70%),
          radial-gradient(1px 1px at 20px 30px, var(--dot) 99%, transparent),
          radial-gradient(1px 1px at 140px 80px, var(--dot) 99%, transparent),
          radial-gradient(1.5px 1.5px at 60px 170px, var(--dot) 99%, transparent),
          radial-gradient(1px 1px at 210px 210px, var(--dot) 99%, transparent),
          radial-gradient(1.5px 1.5px at 180px 140px, var(--dot) 99%, transparent);
        background-size:
          100% 100%,
          280px 260px,
          280px 260px,
          280px 260px,
          280px 260px,
          280px 260px;
        color: var(--text-dim);
        font-family: -apple-system, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
        overflow: hidden;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      .orbit {
        position: relative;
        width: 120px;
        height: 120px;
        margin: 0 auto 32px;
        border: 1px dashed var(--accent);
        border-radius: 50%;
        opacity: 0.8;
      }
      /* The "planet" the visitor drifted away from. */
      .orbit::before {
        content: '';
        position: absolute;
        inset: 38px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.25;
      }
      /* Positioned every frame by the script below, from the orbit's center. */
      .stray {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 8px;
        height: 8px;
        margin: -4px 0 0 -4px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
        will-change: transform, opacity;
      }
      .code {
        margin: 0;
        color: var(--accent);
        font-family: ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace;
        font-size: 13px;
        letter-spacing: 0.12em;
      }
      h1 {
        margin: 8px 0 12px;
        color: var(--text);
        font-size: 32px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 28px;
      }
      a {
        display: inline-block;
        padding: 8px 16px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }
      a:hover {
        background: var(--accent);
        color: var(--bg);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="orbit" aria-hidden="true">
        <span class="stray" id="stray"></span>
      </div>
      <p class="code">404 · SIGNAL LOST</p>
      <h1>Lost in orbit</h1>
      <p>This page drifted out of range, or never existed. Let's get you back on course.</p>
      <a href="/">Return to base</a>
    </main>
    <script>
      // The satellite rides the ring for a fifth to a quarter of a lap, then
      // spirals off it: its distance from the ring grows exponentially (slow
      // at first, then faster) while its angular speed falls as it moves
      // out, the way an orbit slows with altitude. Both come from the same
      // clock, so the path stays one smooth curve while it fades.
      (function () {
        var stray = document.getElementById('stray');
        var R = 60; // ring radius in px (half the 120px orbit)
        var growth = 0.6; // exponential rate of moving away
        var seed = 2; // px/s initial outward speed
        var step = 1 / 60;
        var rand = function (min, max) {
          return min + Math.random() * (max - min);
        };
        // Angular speed on the ring; this range puts the break-away at
        // roughly 1/5 to 1/4 of a lap.
        var omega0 = rand(0.6, 0.75);
        var dir = Math.random() < 0.5 ? 1 : -1;

        var radiusAt = function (t) {
          return R + (seed / growth) * (Math.exp(growth * t) - 1);
        };
        var opacityAt = function (r) {
          var away = r - R;
          return away < 25 ? 1 : Math.max(0, 1 - (away - 25) / 70);
        };

        // Run the path once up front to learn how far around it travels, then
        // choose the start so it fades out above the planet, clear of the
        // text below. The start is still random within that.
        var sweep = 0;
        for (var t = step; opacityAt(radiusAt(t)) > 0; t += step) {
          sweep += omega0 * Math.pow(R / radiusAt(t), 1.5) * step;
        }
        // Anywhere from about 3 to 9 o'clock over the top; at that distance
        // even the lowest of those stays above the text.
        var fadeAt = -Math.PI / 2 + rand(-1.9, 1.9);
        var start = fadeAt - dir * sweep;

        var place = function (theta, r, opacity) {
          stray.style.transform =
            'translate(' + Math.cos(theta) * r + 'px,' + Math.sin(theta) * r + 'px)';
          stray.style.opacity = opacity;
        };

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          // A still frame just after it has slipped off the ring.
          place(start + dir * sweep * 0.6, radiusAt(3), 0.85);
          return;
        }

        var theta = start;
        var elapsed = 0;
        var last = performance.now();
        var tick = function (now) {
          var dt = Math.min((now - last) / 1000, 0.05);
          last = now;
          elapsed += dt;
          var r = radiusAt(elapsed);
          theta += dir * omega0 * Math.pow(R / r, 1.5) * dt;
          var opacity = opacityAt(r);
          place(theta, r, opacity);
          if (opacity > 0) requestAnimationFrame(tick);
        };
        place(start, R, 1);
        requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
