<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex" />
    <title>Lost in orbit · Brian Yip</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Standalone on purpose: GitHub Pages serves this file as-is for any
         unknown path, so it can't rely on the app bundle. Colors mirror
         src/styles/global.css. -->
    <style>
      :root {
        --bg: #f7f6f9;
        --text: #1f1e1c;
        --text-dim: #63605a;
        --rule: #dcd9d2;
        --accent: #6b46d6;
        --dot: rgba(31, 30, 28, 0.18);
        --glow: rgba(107, 70, 214, 0.1);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111014;
          --text: #e8e6e3;
          --text-dim: #a19e99;
          --rule: #2a2c30;
          --accent: #b69cff;
          --dot: rgba(255, 255, 255, 0.28);
          --glow: rgba(140, 100, 255, 0.14);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background-color: var(--bg);
        background-image:
          radial-gradient(900px 600px at 0% 0%, var(--glow), transparent 70%),
          radial-gradient(1px 1px at 20px 30px, var(--dot) 99%, transparent),
          radial-gradient(1px 1px at 140px 80px, var(--dot) 99%, transparent),
          radial-gradient(1.5px 1.5px at 60px 170px, var(--dot) 99%, transparent),
          radial-gradient(1px 1px at 210px 210px, var(--dot) 99%, transparent),
          radial-gradient(1.5px 1.5px at 180px 140px, var(--dot) 99%, transparent);
        background-size:
          100% 100%,
          280px 260px,
          280px 260px,
          280px 260px,
          280px 260px,
          280px 260px;
        color: var(--text-dim);
        font-family: -apple-system, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
        overflow: hidden;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      .orbit {
        position: relative;
        width: 120px;
        height: 120px;
        margin: 0 auto 32px;
        border: 1px dashed var(--accent);
        border-radius: 50%;
        opacity: 0.8;
      }
      /* The "planet" the visitor drifted away from. */
      .orbit::before {
        content: '';
        position: absolute;
        inset: 38px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.25;
      }
      /* The satellite sits on an arm rotated to a random point on the orbit
         (set by the script below), then drifts outward off it. */
      .arm {
        position: absolute;
        inset: 0;
        transform: rotate(var(--start, 0deg));
      }
      .stray {
        position: absolute;
        top: -4px;
        left: 50%;
        width: 8px;
        height: 8px;
        margin-left: -4px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
        animation: drift 9s ease-in-out infinite alternate;
      }
      @keyframes drift {
        to {
          transform: translate(var(--dx, 40px), var(--dy, -70px));
          opacity: 0.4;
        }
      }
      .code {
        margin: 0;
        color: var(--accent);
        font-family: ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace;
        font-size: 13px;
        letter-spacing: 0.12em;
      }
      h1 {
        margin: 8px 0 12px;
        color: var(--text);
        font-size: 32px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 28px;
      }
      a {
        display: inline-block;
        padding: 8px 16px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }
      a:hover {
        background: var(--accent);
        color: var(--bg);
      }
      @media (prefers-reduced-motion: reduce) {
        .stray {
          animation: none;
          transform: translate(calc(var(--dx, 40px) * 0.6), calc(var(--dy, -70px) * 0.6));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="orbit" aria-hidden="true">
        <span class="arm" id="arm"><span class="stray"></span></span>
      </div>
      <p class="code">404 · SIGNAL LOST</p>
      <h1>Lost in orbit</h1>
      <p>This page drifted out of range, or never existed. Let's get you back on course.</p>
      <a href="/">Return to base</a>
    </main>
    <script>
      (function () {
        var rand = function (min, max) {
          return min + Math.random() * (max - min);
        };
        var arm = document.getElementById('arm');
        // Upper part of the orbit only, so it never drifts into the text below.
        arm.style.setProperty('--start', rand(-110, 110) + 'deg');
        // In the arm's frame "up" is away from the planet, so dy is outward.
        arm.style.setProperty('--dx', rand(-50, 50) + 'px');
        arm.style.setProperty('--dy', -rand(45, 85) + 'px');
      })();
    </script>
  </body>
</html>
